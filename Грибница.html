<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Грибница</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,800;1,800&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the mushroom stage (counter, big clickable cap, meadow of grown mushrooms) stays pinned on the left;
   the shop (upgrades, farm, stats) scrolls on the right. On phones the stage sits on top and the shop follows. */
:root {
  color-scheme: dark;
  --soil: #16110e;
  --loam: #211a15;
  --loam-2: #2c231c;
  --line: #3b2f26;
  --ink: #eee3d2;
  --ink-2: #a69886;
  --cap: #d4452f;
  --cap-deep: #a3301f;
  --bone: #efe6d4;
  --bone-shade: #cdbfa6;
  --gills: #bba98c;
  --moss: #a5c45f;
  --ochre: #d29a45;
  --spore: #f3c95f;
  --spring: #a5c45f;
  --summer: #e0b04a;
  --autumn: #e0693a;
  --winter: #8fb4cf;
  --f-display: 'Alegreya', Georgia, 'Times New Roman', serif;
  --f-body: 'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--soil);
  color: var(--ink);
  font: 400 16px/1.4 var(--f-body);
  padding-inline: 16px;
  padding-block: 20px;
}
h1, h2, p, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--moss); outline-offset: 3px; }

.app {
  max-width: 1080px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
}
@media (min-width: 860px) {
  .app { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
  .stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); min-height: 600px; }
}

/* ---------- stage ---------- */
.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
  padding: 18px 16px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  --glow: #33461f;
  --sc: var(--spring);
  background:
    radial-gradient(circle at 50% 52%, var(--glow) 0, transparent 62%),
    var(--loam);
}
.stage.sp { --glow: #33461f; --sc: var(--spring); }
.stage.su { --glow: #4d3d17; --sc: var(--summer); }
.stage.au { --glow: #52291a; --sc: var(--autumn); }
.stage.wi { --glow: #2a3a4b; --sc: var(--winter); }
.stage.rain { box-shadow: inset 0 0 70px rgba(165, 196, 95, .28); }
.brand {
  align-self: flex-start;
  font: italic 800 1.5rem/1 var(--f-display);
  letter-spacing: .01em;
}
.count { margin-top: 18px; text-align: center; }
.num {
  font: 800 clamp(2.4rem, 8vw, 3.4rem)/1 var(--f-display);
  font-variant-numeric: lining-nums tabular-nums;
  overflow-wrap: anywhere;
}
.unit { margin-top: 2px; color: var(--ink-2); font-size: 1.05rem; }
.rate {
  margin-top: 8px;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px;
  font-family: var(--f-mono); font-size: .9rem; color: var(--ink-2);
}
.rate b { color: var(--ink); font-weight: 500; }
.frenzy {
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--moss);
  color: #1b2310;
  font-family: var(--f-body); font-weight: 700; font-size: .85rem;
}
.toast { min-height: 2.6em; margin-top: 8px; max-width: 34ch; text-align: center; font-size: .95rem; color: var(--spore); }

.shroom {
  margin-block: 6px 10px;
  width: clamp(160px, min(46vw, 32vh), 270px);
  padding: 0; border: 0; background: none; border-radius: 50%;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .12s ease-out;
}
.shroom svg { display: block; width: 100%; height: auto; overflow: visible; }
.shroom:hover { transform: scale(1.03); }
.shroom:active { transform: scale(.96); }
.shroom.pop svg { animation: squish .22s ease-out; transform-origin: 50% 94%; }
@keyframes squish {
  0% { transform: scale(1, 1); }
  35% { transform: scale(1.06, .9); }
  100% { transform: scale(1, 1); }
}
.s-ground { fill: rgba(0, 0, 0, .38); }
.s-stem { fill: var(--bone); }
.s-stem-shade { fill: var(--bone-shade); }
.s-gills { fill: var(--gills); }
.s-ring { fill: var(--bone); stroke: var(--bone-shade); stroke-width: 1.5; }
.s-cap { fill: var(--cap); }
.s-cap-shade { fill: var(--cap-deep); }
.s-spots circle { fill: var(--bone); }

.float {
  position: absolute; z-index: 5; pointer-events: none;
  transform: translate(-50%, -50%);
  font: 500 1.1rem/1 var(--f-mono);
  color: var(--spore);
  text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, .6);
  white-space: nowrap;
}
.puff {
  position: absolute; z-index: 4; pointer-events: none;
  width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: var(--bone);
}
.gold {
  position: absolute; z-index: 6;
  width: 54px; height: 54px; margin: -27px 0 0 -27px;
  padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 38% 34%, #fff6cf 0, var(--spore) 38%, #c98f1f 72%, rgba(201, 143, 31, 0) 74%);
  box-shadow: 0 0 22px 8px rgba(243, 201, 95, .55);
  animation: bob 2.2s ease-in-out infinite, appear .35s ease-out;
}
@keyframes bob { 0%, 100% { translate: 0 -5px; } 50% { translate: 0 6px; } }
@keyframes appear { from { scale: 0; } to { scale: 1; } }

.grove {
  position: relative;
  width: calc(100% + 32px);
  height: 92px;
  margin-top: auto;
  background: linear-gradient(to top, #0e0a08 0 24px, transparent 24px);
}
.mini {
  position: absolute;
  display: block;
  transform-origin: 50% 100%;
  animation: sprout .6s ease-out backwards;
}
.mini svg { display: block; width: 100%; height: 100%; }
@keyframes sprout { from { transform: scale(0); } to { transform: scale(1); } }

/* ---------- seasons ---------- */
.s-snow { fill: #f1f5f8; opacity: 0; transition: opacity .8s; }
.stage.wi .s-snow { opacity: 1; }
.season { width: 100%; max-width: 340px; margin-top: 12px; display: grid; gap: 6px; }
.s-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.s-name { font: italic 800 1.3rem/1 var(--f-display); color: var(--sc); }
.s-left { font: 400 .85rem var(--f-mono); color: var(--ink-2); }
.s-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.s-bar i { position: relative; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.s-bar i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--c); }
.s-bar i:nth-child(1) { --c: var(--spring); }
.s-bar i:nth-child(2) { --c: var(--summer); }
.s-bar i:nth-child(3) { --c: var(--autumn); }
.s-bar i:nth-child(4) { --c: var(--winter); }
.s-note { min-height: 2.6em; font-size: .9rem; color: var(--ink-2); text-align: center; }

/* ---------- mycelium map ---------- */
.maphint { font: 400 .85rem var(--f-mono); color: var(--ink-2); }
.mapgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cell {
  position: relative; display: grid; place-items: center;
  aspect-ratio: 1; padding: 0; overflow: hidden; cursor: default;
  background: var(--loam); border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-2);
}
.cell .ic { width: 58%; height: 58%; opacity: .45; }
.cell .web { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }
.cell .cc { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font: 500 .62rem/1 var(--f-mono); color: var(--ink-2); }
.cell.rock .ic { opacity: .8; }
.cell.fr { border-style: dashed; border-color: var(--ink-2); }
.cell.fr .ic { opacity: .85; }
.cell.fr.ok { cursor: pointer; border-color: var(--moss); background: var(--loam-2); }
.cell.fr.ok .cc { color: var(--moss); }
.cell.fr.ok:hover { transform: scale(1.05); }
.cell.on { background: var(--loam-2); border: 1px solid var(--bone-shade); }
.cell.on .ic { opacity: 1; }
.cell.on .web { opacity: .5; }
.maplock { margin-top: 8px; color: var(--winter); font-size: .92rem; }
.legend { margin: 12px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 6px 16px; }
.legend li { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: .86rem; color: var(--ink-2); }
.legend svg { flex: none; width: 20px; height: 20px; }

/* ---------- shop ---------- */
.side { display: grid; gap: 20px; min-width: 0; }
.block { min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; }
h2 {
  font: 700 .8rem/1.2 var(--f-body);
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2);
}
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button {
  padding: 4px 12px; border: 0; background: transparent; cursor: pointer;
  font: 500 .85rem var(--f-mono); color: var(--ink-2);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--soil); }

.upgrades { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.up {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0; padding: 10px 12px; text-align: left; cursor: pointer;
  background: var(--loam); border: 1px solid var(--line); border-radius: 8px;
}
.up:not(:disabled):hover { background: var(--loam-2); border-color: var(--ink-2); }
.up:disabled { cursor: default; }
.u-name { font: 700 1.05rem/1.2 var(--f-display); }
.u-desc { font-size: .88rem; color: var(--ink-2); }
.u-cost { margin-top: auto; padding-top: 4px; font: 500 .85rem var(--f-mono); color: var(--ink-2); }
.up.ok .u-cost { color: var(--moss); }
.empty { color: var(--ink-2); font-size: .95rem; padding-block: 6px; }
.more { grid-column: 1 / -1; color: var(--ink-2); font-size: .85rem; }

.gens { display: grid; gap: 8px; }
.gen {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px;
  width: 100%; padding: 10px 14px; text-align: left; cursor: pointer;
  background: var(--loam); border: 1px solid var(--line); border-radius: 8px;
}
.gen:not(:disabled):hover { background: var(--loam-2); border-color: var(--ink-2); }
.gen:disabled { cursor: default; }
.g-name { font: 700 1.2rem/1.2 var(--f-display); }
.g-flavor { font-size: .9rem; color: var(--ink-2); }
.g-line { margin-top: 4px; font: 400 .85rem var(--f-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.g-cost { font-weight: 500; }
.gen.ok .g-cost { color: var(--moss); }
.g-own {
  grid-column: 2; grid-row: 1 / span 3; align-self: center;
  min-width: 2ch; text-align: right;
  font: 800 2rem/1 var(--f-display); font-variant-numeric: lining-nums tabular-nums;
  color: var(--ink);
}
.gen.locked .g-name, .gen.locked .g-own { color: var(--ink-2); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.stats dt { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.stats dd { margin-top: 2px; font: 500 1rem var(--f-mono); overflow-wrap: anywhere; }
.foot {
  margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  font-size: .88rem; color: var(--ink-2);
}
.reset {
  padding: 6px 12px; cursor: pointer; background: transparent;
  border: 1px solid var(--line); border-radius: 7px; color: var(--ink-2);
}
.reset:hover { border-color: var(--cap); color: var(--ink); }
.reset.armed { background: var(--cap-deep); border-color: var(--cap); color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .shroom, .stage { transition: none; }
  .shroom.pop svg, .mini, .gold { animation: none; }
}
</style>

<main class="app">
  <section class="stage" id="stage" aria-label="Грибная поляна">
    <h1 class="brand">Грибница</h1>
    <div class="count">
      <div class="num" id="spores">0</div>
      <div class="unit" id="unit">спор</div>
    </div>
    <div class="rate"><span><b id="cps">0</b> спор/с</span><span class="frenzy" id="frenzy" hidden></span></div>
    <div class="season">
      <div class="s-top"><span class="s-name" id="s-name">Весна</span><span class="s-left" id="s-left"></span></div>
      <div class="s-bar" id="s-bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="s-note" id="s-note"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <button class="shroom" id="shroom" type="button" aria-label="Собрать споры">
      <svg viewBox="0 0 240 250" aria-hidden="true" focusable="false">
        <ellipse class="s-ground" cx="120" cy="238" rx="80" ry="9"/>

        <g class="s-spots">
          <circle cx="72" cy="74" r="13"/><circle cx="128" cy="48" r="10"/><circle cx="170" cy="86" r="15"/>
          <circle cx="110" cy="102" r="9"/><circle cx="62" cy="116" r="8"/><circle cx="200" cy="122" r="7"/>
          <circle cx="142" cy="124" r="11"/><circle cx="92" cy="50" r="6"/>
        </g>
        <path class="s-snow" d="M44 78 C58 44 88 22 120 20 C152 22 182 44 196 78 C184 70 172 72 162 80 C150 70 138 72 128 82 C118 70 104 72 94 82 C84 72 70 70 44 78 Z"/>
      </svg>
    </button>

    <div class="grove" id="grove" aria-hidden="true"></div>
  </section>

  <section class="side">
    <div class="block">
      <div class="head"><h2>Карта мицелия</h2><span class="maphint" id="maphint"></span></div>
      <div class="mapgrid" id="mapgrid" role="group" aria-label="Карта мицелия"></div>
      <p class="maplock" id="maplock" hidden>Зимой гифы спят. Новые клетки откроются весной.</p>

    <div class="block">

      <div class="head"><h2>Статистика</h2></div>

        <button class="reset" id="reset" type="button">Сбросить прогресс</button>
      </div>
    </div>
  </section>
</main>

    b.setAttribute('aria-label', 'Золотая спора: нажмите, чтобы получить бонус');
    b.style.left = (14 + Math.random() * 72) + '%';
    b.style.top = (20 + Math.random() * 45) + '%';
    stage.appendChild(b);
    var done = false;
    b.addEventListener('click', function () {
      done = true; b.remove();
      if (Math.random() < 0.5) {
        var g = Math.max(cps() * 180, clickVal() * 30);
        gain(g);
        toast('Золотая спора: +' + fmt(g) + ' спор сразу.');
      } else {
        S.frenzy = Date.now() + 30000;
        toast('Грибной дождь: всё растёт в 7 раз быстрее 30 секунд.');
      }
      render();
      scheduleGold();
    });
    setTimeout(function () { if (!done) { b.remove(); scheduleGold(); } }, 13000);
  }

  /* ---------- render ---------- */
  var tickN = 0;
  function render(force) {
    var sp = Math.floor(S.spores);
    elSpores.textContent = fmt(S.spores);
    elUnit.textContent = S.spores < 1e6 ? plural(sp, ['спора', 'споры', 'спор']) : 'спор';
    var c = cps();
    elCps.textContent = fmtRate(c);
    var on = frenzyOn();
    stage.classList.toggle('rain', on);
    elFrenzy.hidden = !on;
    if (on) elFrenzy.textContent = 'Грибной дождь ×7 · ' + Math.ceil((S.frenzy - Date.now()) / 1000) + ' с';

    for (var i = 0; i < GENS.length; i++) {
      var g = GENS[i], r = rows[i];
      var unlocked = S.gens[i] > 0 || S.total >= g.base * 0.5;
      var n = nFor(i), cost = costN(i, n), ok = unlocked && S.spores >= cost;
      r.b.disabled = !ok;
      r.b.classList.toggle('ok', ok);
      r.b.classList.toggle('locked', !unlocked);
      if (!unlocked) {
        r.name.textContent = '???';
        r.fl.textContent = 'Накопите ещё спор, чтобы открыть.';
        r.cost.textContent = ''; r.rate.textContent = '';
        r.own.textContent = '';
      } else {
        r.name.textContent = g.name;
        r.fl.textContent = g.flavor;
        r.cost.textContent = (n > 1 ? '×' + n + ' · ' : '') + fmt(cost) + ' спор';
        r.rate.textContent = ' · по ' + fmtRate(unitRate(i)) + '/с каждая' +
          (terrMult[i] > 1 ? ' · карта ×' + terrMult[i].toLocaleString('ru-RU', { maximumFractionDigits: 2 }) : '');
        r.own.textContent = S.gens[i];
      }
    }
    var si = seasonIdx(), se = SEASONS[si];
    if (si !== shownSeason) {
      SEASONS.forEach(function (x) { stage.classList.remove(x.cls); });
      stage.classList.add(se.cls);
      sName.textContent = se.name;
      sNote.textContent = se.note;
      mapLock.hidden = se.grow != null;
      shownSeason = si;
    }
    sLeft.textContent = 'ещё ' + mmss(seasonLeft());
    for (var k = 0; k < 4; k++) {
      var p = k < si ? 100 : k === si ? (S.clock % SEASON_LEN) / SEASON_LEN * 100 : 0;
      sBar.children[k].style.setProperty('--p', p.toFixed(1) + '%');
    }
    mapHint.textContent = 'Заселено ' + colonized + ' из ' + PLAYABLE + ' · сеть +' + Math.round((netMult - 1) * 100) + '%';
    updateMap();
    renderUpgrades(force);
    if (force || tickN % 5 === 0) {
      renderGrove();
      stTotal.textContent = fmt(S.total);
      stClicks.textContent = S.clicks.toLocaleString('ru-RU');
      stClick.textContent = fmt(clickVal(), 1);
      stTime.textContent = fmtTime(S.playtime);
    }
  }

  /* ---------- loop and saving ---------- */
  var last = Date.now();
  function tick() {
    var now = Date.now();
    var dt = Math.min(Math.max((now - last) / 1000, 0), 3600);
    last = now;
    var g = cps() * dt;
    S.spores += g; S.total += g; S.playtime += dt;
    var before = seasonIdx();
    S.clock += dt;
    var after = seasonIdx();
    if (after !== before) toast(SEASONS[after].msg, 7000);
    tickN++;
    render();
  }
  function save() {
    try {
      S.savedAt = Date.now();
      localStorage.setItem(KEY, JSON.stringify(S));
      elSaved.textContent = 'Сохранено в ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      elSaved.textContent = 'В этом окне сохранение недоступно';
    }
  }

  var armed = false, armTimer = 0;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      armed = true;
      resetBtn.classList.add('armed');
      resetBtn.textContent = 'Нажмите ещё раз, чтобы стереть всё';
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    S = fresh();
    recalc();
    groveEl.textContent = ''; groveCount = 0;
    mapCells.forEach(function (c) { c.key = null; });
    shownSeason = -1;
    try { localStorage.removeItem(KEY); } catch (e) {}
    render(true);
    toast('Прогресс сброшен. Новая грибница ждёт.');
  });
  function disarm() {
    armed = false; clearTimeout(armTimer);
    resetBtn.classList.remove('armed');
    resetBtn.textContent = 'Сбросить прогресс';
  }

  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);

  /* ---------- start ---------- */
  recalc();
  if (loaded) {
    var away = Math.max(0, (Date.now() - S.savedAt) / 1000);
    if (away > 60) {
      var g0 = rawCps() * Math.min(away, 28800) * 0.5;
      S.clock += Math.min(away, 28800);
      if (g0 > 0) {
        gain(g0);
        toast('Пока вас не было (' + fmtTime(away) + '), мицелий собрал ' + fmt(g0) + ' спор.', 9000);
      }
    }
  }
  render(true);
  setInterval(tick, 100);
  setInterval(save, 10000);
  scheduleGold(20000);
})();
</script>

</body></html>
